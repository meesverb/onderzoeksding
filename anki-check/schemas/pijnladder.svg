<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" style="width:100%;max-width:640px;height:auto;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif"><defs><marker id="ppijnladder" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b82"/></marker></defs><rect x="0" y="0" width="640" height="330" rx="12" fill="#ffffff"/><rect x="20" y="250" width="190" height="60" rx="8" fill="#eef2f7" stroke="#5b6b82" stroke-width="1.5"/><text x="115" y="276.1" font-size="15" text-anchor="middle" fill="#1b2430">Stap 1: paracetamol</text><text x="115" y="294.4" font-size="15" text-anchor="middle" fill="#1b2430">± NSAID</text><rect x="160" y="175" width="190" height="60" rx="8" fill="#eef2f7" stroke="#5b6b82" stroke-width="1.5"/><text x="255" y="201.1" font-size="15" text-anchor="middle" fill="#1b2430">Stap 2: zwak opioïd</text><text x="255" y="219.4" font-size="15" text-anchor="middle" fill="#1b2430">(tramadol)</text><rect x="300" y="100" width="190" height="60" rx="8" fill="#eef2f7" stroke="#5b6b82" stroke-width="1.5"/><text x="395" y="126.1" font-size="15" text-anchor="middle" fill="#1b2430">Stap 3: sterk opioïd</text><text x="395" y="144.4" font-size="15" text-anchor="middle" fill="#1b2430">(morfine, oxycodon)</text><rect x="440" y="25" width="180" height="60" rx="8" fill="#eef2f7" stroke="#5b6b82" stroke-width="1.5"/><text x="530" y="51.4" font-size="14" text-anchor="middle" fill="#1b2430">Stap 4: parenteraal /</text><text x="530" y="68.4" font-size="14" text-anchor="middle" fill="#1b2430">invasief</text><rect x="20" y="25" width="380" height="56" rx="8" fill="#f7f7f4" stroke="#5b6b82" stroke-width="1.5" stroke-dasharray="4 3"/><text x="210" y="49.1" font-size="15" text-anchor="middle" fill="#1b2430">By mouth · by the clock ·</text><text x="210" y="67.4" font-size="15" text-anchor="middle" fill="#1b2430">by the ladder · for the individual</text></svg>