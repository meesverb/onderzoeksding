ke-width="1.5"/><text x="530" y="144.6" font-size="12" text-anchor="middle" fill="#1b2430">MCV &gt; 100: macrocytair</text><text x="530" y="159.2" font-size="12" text-anchor="middle" fill="#1b2430">B12/folaat, alcohol, lever,</text><text x="530" y="173.8" font-size="12" text-anchor="middle" fill="#1b2430">hypothyreoïdie, MDS</text><rect x="120" y="250" width="190" height="80" rx="8" fill="#eef2f7" stroke="#5b6b82" stroke-width="1.5"/><text x="215" y="276.9" font-size="15" text-anchor="middle" fill="#1b2430">Reticulocyten laag:</text><text x="215" y="295.2" font-size="15" text-anchor="middle" fill="#1b2430">aanmaak (ACD, nier,</text><text x="215" y="313.6" font-size="15" text-anchor="middle" fill="#1b2430">beenmerg)</text><rect x="330" y="250" width="190" height="80" rx="8" fill="#eef2f7" stroke="#5b6b82" stroke-width="1.5"/><text x="425" y="276.9" font-size="15" text-anchor="middle" fill="#1b2430">Reticulocyten hoog:</text><text x="425" y="295.2" font-size="15" text-anchor="middle" fill="#1b2430">hemolyse of</text><text x="425" y="313.6" font-size="15" text-anchor="middle" fill="#1b2430">bloedverlies</text></svg>